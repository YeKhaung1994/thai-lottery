services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: htawpyi-mssql
    environment:
      ACCEPT_EULA: "Y"
      # Set in db/.env (blank template in db/.env.example).
      # Must satisfy SQL Server policy: 8+ chars, upper+lower+digit/symbol.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mssql-data:
